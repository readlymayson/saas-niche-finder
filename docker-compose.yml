services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: niche_finder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/niche_finder
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-in-production}
      YANDEX_DIRECT_OAUTH_TOKEN: ${YANDEX_DIRECT_OAUTH_TOKEN:-}
      YANDEX_DIRECT_CLIENT_LOGIN: ${YANDEX_DIRECT_CLIENT_LOGIN:-}
      YANDEX_GPT_API_KEY: ${YANDEX_GPT_API_KEY:-}
      YANDEX_GPT_FOLDER_ID: ${YANDEX_GPT_FOLDER_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/niche_finder
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-in-production}
      YANDEX_DIRECT_OAUTH_TOKEN: ${YANDEX_DIRECT_OAUTH_TOKEN:-}
      YANDEX_DIRECT_CLIENT_LOGIN: ${YANDEX_DIRECT_CLIENT_LOGIN:-}
      YANDEX_GPT_API_KEY: ${YANDEX_GPT_API_KEY:-}
      YANDEX_GPT_FOLDER_ID: ${YANDEX_GPT_FOLDER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/niche_finder
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-in-production}
      YANDEX_DIRECT_OAUTH_TOKEN: ${YANDEX_DIRECT_OAUTH_TOKEN:-}
      YANDEX_DIRECT_CLIENT_LOGIN: ${YANDEX_DIRECT_CLIENT_LOGIN:-}
      YANDEX_GPT_API_KEY: ${YANDEX_GPT_API_KEY:-}
      YANDEX_GPT_FOLDER_ID: ${YANDEX_GPT_FOLDER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Обучение RuBERT / эмбеддинги: torch+transformers, не поднимается по умолчанию.
  # Код `ml/` монтируется с хоста — правки без пересборки образа (пересборка нужна при смене зависимостей).
  # Сборка датасета: docker compose --profile ml run --rm ml-train python ml/build_demo_dataset.py
  # Обучение:        docker compose --profile ml run --rm ml-train
  ml-train:
    profiles: ["ml"]
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
    volumes:
      - ./backend/ml:/app/ml
    environment:
      # При необходимости ограничить потоки (CPU)
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}

volumes:
  pgdata:
